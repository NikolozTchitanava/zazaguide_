<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Newkaz Certificate</title>
  <desc id="desc">Certificate for Zaza Chitanava for tourism management and tourist guiding training.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcfcfb" />
      <stop offset="100%" stop-color="#ece7e0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)" />
  <rect x="30" y="30" width="1140" height="840" fill="none" stroke="#5b1b2d" stroke-width="2" />
  <text x="600" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#5b1b2d">Tourism Development Center</text>
  <text x="600" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="112" font-weight="700" fill="#c1272d">Newkaz</text>
  <text x="600" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="86" letter-spacing="10" fill="#111">CERTIFICATE</text>
  <text x="600" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" fill="#222">This is to certify that</text>
  <text x="600" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#111">ZAZA CHITANAVA</text>
  <line x1="320" y1="450" x2="880" y2="450" stroke="#111" stroke-width="2" />
  <text x="600" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="#111">Has successfully completed practical and theoretical</text>
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="#111">training course of tourism management and tourist guiding</text>
  <text x="220" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#222">Director</text>
  <line x1="130" y1="710" x2="310" y2="710" stroke="#222" stroke-width="2" />
  <text x="600" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#222">N C050717 02 | APR-MAY-JUNE 2017</text>
  <line x1="495" y1="710" x2="705" y2="710" stroke="#222" stroke-width="2" />
  <text x="980" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#222">Executive Director</text>
  <line x1="890" y1="710" x2="1070" y2="710" stroke="#222" stroke-width="2" />
</svg>
